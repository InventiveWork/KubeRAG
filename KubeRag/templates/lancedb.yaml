{{- if .Values.vectorStore.lancedb.deploy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-lancedb
  namespace: {{ .Release.Namespace }}
  labels:
    app: lancedb-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lancedb-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: lancedb-server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: lancedb-server
          image: {{ .Values.vectorStore.lancedb.image | default "kuberag-lancedb-server:latest" }}
          imagePullPolicy: {{ .Values.vectorStore.lancedb.pullPolicy | default "IfNotPresent" }}
          env:
            - name: LANCEDB_PATH
              value: {{ .Values.vectorStore.lancedb.uri | default "/data/lancedb" | quote }}
            - name: LANCEDB_TABLE
              value: {{ .Values.vectorStore.lancedb.tableName | default "documents" | quote }}
            - name: LANCEDB_METRIC
              value: {{ .Values.vectorStore.lancedb.metric | default "cosine" | quote }}
            - name: LANCEDB_DIMENSION
              value: {{ .Values.vectorStore.dimension | default 768 | quote }}
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: lancedb-data
              mountPath: /data
          resources:
{{ toYaml (.Values.vectorStore.lancedb.resources | default dict) | indent 12 }}
      volumes:
        - name: lancedb-data
{{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-lancedb-pvc
{{- else }}
          emptyDir: {}
{{- end }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-lancedb-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    app: lancedb-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "10Gi" }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-lancedb-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: lancedb-server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app: lancedb-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
