{{- if .Values.vectorStore.faiss.deploy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faiss-server
  labels:
    app: faiss-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faiss-server
  template:
    metadata:
      labels:
        app: faiss-server
    spec:
      containers:
      - name: faiss-server
        image: kuberag-faiss-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: FAISS_INDEX_PATH
          value: "/data/faiss_index"
        - name: FAISS_METADATA_PATH
          value: "/data/faiss_metadata.pkl"
        volumeMounts:
        - name: faiss-data
          mountPath: /data
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: faiss-data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: faiss-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: faiss-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size | default "10Gi" }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: faiss-service
  labels:
    app: faiss-server
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: faiss-server
{{- end }}