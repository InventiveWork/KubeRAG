{{- if .Values.vectorStore.qdrant.deploy }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  labels:
    app: qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest #Or specify a specific version
        ports:
        - containerPort: 6333 # gRPC port
        - containerPort: 6332 # HTTP port
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
      volumes:
      - name: qdrant-data
        persistentVolumeClaim:
          claimName: qdrant-pvc #Referencing a PVC
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-service
  labels:
    app: qdrant
spec:
  ports:
  - name: grpc
    port: 6333
    targetPort: 6333
  - name: http
    port: 6332
    targetPort: 6332
  selector:
    app: qdrant
  type: ClusterIP # Or NodePort, LoadBalancer depending on your needs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
spec:
  accessModes:
  - ReadWriteOnce #Or ReadWriteMany if needed
  resources:
    requests:
      storage: 10Gi # Adjust storage size as needed.
{{- end }}