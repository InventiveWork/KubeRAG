apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kuberag
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
type: Opaque
stringData:
  # LLM API Keys - Support all providers
  {{- if .Values.llm.azureOpenai.apiKey }}
  AZURE_OPENAI_API_KEY: {{ .Values.llm.azureOpenai.apiKey | quote }}
  {{- end }}
  {{- if .Values.llm.azureOpenai.endpoint }}
  AZURE_OPENAI_ENDPOINT: {{ .Values.llm.azureOpenai.endpoint | quote }}
  {{- end }}
  {{- if .Values.llm.azureOpenai.deployment }}
  AZURE_OPENAI_DEPLOYMENT: {{ .Values.llm.azureOpenai.deployment | quote }}
  {{- end }}
  {{- if .Values.llm.azureOpenai.apiVersion }}
  AZURE_API_VERSION: {{ .Values.llm.azureOpenai.apiVersion | quote }}
  {{- end }}
  
  {{- if .Values.llm.openai.apiKey }}
  OPENAI_API_KEY: {{ .Values.llm.openai.apiKey | quote }}
  {{- end }}
  {{- if .Values.llm.openai.model }}
  OPENAI_MODEL: {{ .Values.llm.openai.model | quote }}
  {{- end }}
  {{- if .Values.llm.openai.baseUrl }}
  OPENAI_BASE_URL: {{ .Values.llm.openai.baseUrl | quote }}
  {{- end }}
  
  {{- if .Values.llm.anthropic.apiKey }}
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropic.apiKey | quote }}
  {{- end }}
  {{- if .Values.llm.anthropic.model }}
  ANTHROPIC_MODEL: {{ .Values.llm.anthropic.model | quote }}
  {{- end }}
  
  {{- if .Values.llm.gemini.apiKey }}
  GOOGLE_API_KEY: {{ .Values.llm.gemini.apiKey | quote }}
  {{- end }}
  {{- if .Values.llm.gemini.model }}
  GEMINI_MODEL: {{ .Values.llm.gemini.model | quote }}
  {{- end }}
  
  {{- if .Values.llm.ollama.baseUrl }}
  OLLAMA_BASE_URL: {{ .Values.llm.ollama.baseUrl | quote }}
  {{- end }}
  {{- if .Values.llm.ollama.model }}
  OLLAMA_MODEL: {{ .Values.llm.ollama.model | quote }}
  {{- end }}

  # Vector Store Credentials
  {{- if eq (.Values.vectorStore.type | default "qdrant") "qdrant" }}
  {{- if .Values.vectorStore.qdrant.apiKey }}
  QDRANT_API_KEY: {{ .Values.vectorStore.qdrant.apiKey | quote }}
  {{- end }}
  {{- else if eq .Values.vectorStore.type "mongodb" }}
  {{- if .Values.vectorStore.mongodb.password }}
  VECTOR_STORE_MONGODB_PASSWORD: {{ .Values.vectorStore.mongodb.password | quote }}
  {{- end }}
  {{- if .Values.vectorStore.mongodb.connectionString }}
  VECTOR_STORE_MONGODB_CONNECTION_STRING: {{ .Values.vectorStore.mongodb.connectionString | quote }}
  {{- end }}
  {{- else if eq .Values.vectorStore.type "postgresql" }}
  {{- if .Values.vectorStore.postgresql.password }}
  VECTOR_STORE_POSTGRESQL_PASSWORD: {{ .Values.vectorStore.postgresql.password | quote }}
  {{- end }}
  {{- if .Values.vectorStore.postgresql.connectionString }}
  VECTOR_STORE_POSTGRESQL_CONNECTION_STRING: {{ .Values.vectorStore.postgresql.connectionString | quote }}
  {{- end }}
  {{- else if eq .Values.vectorStore.type "elasticsearch" }}
  {{- if .Values.vectorStore.elasticsearch.password }}
  VECTOR_STORE_ELASTICSEARCH_PASSWORD: {{ .Values.vectorStore.elasticsearch.password | quote }}
  {{- end }}
  {{- if .Values.vectorStore.elasticsearch.apiKey }}
  VECTOR_STORE_ELASTICSEARCH_API_KEY: {{ .Values.vectorStore.elasticsearch.apiKey | quote }}
  {{- end }}
  {{- if .Values.vectorStore.elasticsearch.cloudId }}
  VECTOR_STORE_ELASTICSEARCH_CLOUD_ID: {{ .Values.vectorStore.elasticsearch.cloudId | quote }}
  {{- end }}
  {{- else if eq .Values.vectorStore.type "neo4j" }}
  {{- if .Values.vectorStore.neo4j.password }}
  VECTOR_STORE_NEO4J_PASSWORD: {{ .Values.vectorStore.neo4j.password | quote }}
  {{- end }}
  {{- end }}

  # Data Pipeline API Key
  {{- if .Values.secrets }}
  {{- if .Values.secrets.DATA_PIPELINE_API_KEY }}
  API_KEY: {{ .Values.secrets.DATA_PIPELINE_API_KEY | quote }}
  {{- end }}
  {{- end }}

  # Note: For production, use external secret management like:
  # - Kubernetes External Secrets Operator
  # - HashiCorp Vault
  # - AWS Secrets Manager
  # - Azure Key Vault
  # - Google Secret Manager
