name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./Orchestrator/Agent
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kuberag-agent:latest
  build-and-push-data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v2
        with:
          context: ./Orchestrator/Data-Pipeline
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/kuberag-data-pipeline:latest
