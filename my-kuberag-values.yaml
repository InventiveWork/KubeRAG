# KubeRAG Configuration
# Generated by KubeRAG Wizard
# Date: Sun Sep 14 22:32:51 EDT 2025

nameOverride: ""
fullnameOverride: ""

# Images
images:
  agent:
    repository: kuberag-agent
    tag: "v1.0.15"
    pullPolicy: IfNotPresent
  pipeline:
    repository: kuberag-pipeline
    tag: "v1.0.6"
    pullPolicy: IfNotPresent

# LLM Configuration
llm:
  provider: "gemini"
  openai:
    model: "gpt-3.5-turbo"
    apiKey: ""
    baseUrl: ""
  azureOpenai:
    deployment: "gpt-4o-mini"
    apiVersion: "2025-01-01-preview"
    endpoint: "https://doge-v2.cognitiveservices.azure.com"
    apiKey: ""
    embedDeployment: "text-embedding-ada-002"
    embedModel: "text-embedding-ada-002"
  anthropic:
    apiKey: ""
    model: "claude-3-5-sonnet-20241022"
  gemini:
    apiKey: "AIzaSyDcJpkNhoargOUH5tkzP86E3c5ODV4wF1g"
    model: "gemini-pro"
  ollama:
    model: "llama2"
    baseUrl: "http://localhost:11434"

# Vector Store Configuration
vectorStore:
  type: "chroma"
  dimension: 384
  collectionName: "documents"

  # ChromaDB Configuration
  chroma:
    host: "chromadb-service"
    port: 8000
    deploy: true

  # Qdrant Configuration (disabled when using ChromaDB)
  qdrant:
    host: "qdrant-service"
    port: 6333
    grpcPort: 6334
    preferGrpc: false
    https: false
    apiKey: ""
    timeout: 5.0
    deploy: false

# Embedding Configuration
embedding:
  model: "all-MiniLM-L6-v2"

# Text Processing Configuration
textProcessing:
  chunkSize: 500
  chunkOverlap: 50
  method: "words"

# Deployment Configuration
deployment:
  agent:
    replicas: 2
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
  pipeline:
    replicas: 1
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"

# Service Configuration
service:
  type: "NodePort"
  agent:
    port: 80
    targetPort: 8082
    nodePort: 31390
  pipeline:
    port: 80
    targetPort: 8001
    nodePort: 31095

# Ingress Configuration
ingress:
  enabled: false
  className: "nginx"
  host: "kuberag.local"
  annotations: {}
  tls:
    enabled: false
    secretName: "kuberag-tls"

# Persistence Configuration
persistence:
  enabled: true
  storageClass: "standard"
  accessMode: "ReadWriteOnce"
  size: "10Gi"

# Security Configuration
security:
  podSecurityContext:
    fsGroup: 2000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000

# Auto-scaling Configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Secrets Configuration
secrets: {}
